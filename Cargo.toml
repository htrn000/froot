[package]
name = "fruitbox-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
pyo3 = { version = "0.28.3", features = ["extension-module"] }

[[bin]]
name = "fruitbox_bench"
path = "src/bin/fruitbox_bench.rs"

[dev-dependencies]
insta = "1.48.0"
