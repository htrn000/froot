name: premerge-validation

on:
  pull_request:
    branches:
      - main
      - preapproved
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    branches:
      - main
      - preapproved
  push:
    branches:
      - main
      - preapproved
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premerge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Pytest
        run: uv run pytest

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo tests
        run: cargo test

  docker-compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

  merge-preapproved-pr:
    name: Merge preapproved PR
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'preapproved' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs:
      - python-checks
      - rust-tests
      - docker-compose-config
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request into preapproved
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --merge
